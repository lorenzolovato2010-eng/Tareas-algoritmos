<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punto 4</title>
<script src="js.js" defer></script>
</head>
<body>
<p>
  <a href="https://mail.google.com" target="_blank">Gmail</a> | 
  <a href="https://outlook.live.com" target="_blank">Hotmail</a> | 
  <a href="https://mail.yahoo.com" target="_blank">Yahoo!</a>
</p>

<table border="1">
<tr>
<td onMouseOver="pintar(this, '#f00')" onMouseOut="pintar(this, '#fff')">Gmail</td>
<td onMouseOver="pintar(this, '#0f0')" onMouseOut="pintar(this, '#fff')">Hotmail</td>
<td onMouseOver="pintar(this, '#00f')" onMouseOut="pintar(this, '#fff')">Yahoo!</td>
</tr>
</table>
</body>
</html>
